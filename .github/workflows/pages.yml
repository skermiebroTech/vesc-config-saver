# Publishes the site: the app from main, plus the SEO files from the seo branch.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: app
      - uses: actions/checkout@v4
        with:
          ref: seo
          path: seo
      - name: Check main has no SEO tags of its own
        run: |
          # SEO tags live on the seo branch. A page on main with its own copy would publish stale tags.
          if grep -l 'property="og:\|application/ld+json\|class="about"' app/*.html; then
            echo "::error::The pages above contain SEO tags. Replace them with <!-- seo:head --> / <!-- seo:about --> and keep the tags on the seo branch."
            exit 1
          fi
      - name: Combine app and SEO files
        run: |
          mkdir _site
          cp -r app/. _site/
          rm -rf _site/.git _site/.github
          python3 - <<'PY'
          from pathlib import Path
          seo = Path("seo")
          for p in Path("_site").glob("*.html"):
              page, head = p.name, "head-" + p.name
              if not (seo / head).exists():
                  continue
              html = p.read_text()
              html = html.replace("<!-- seo:head -->", (seo / head).read_text().rstrip("\n"))
              about = seo / "about-index.html"
              if page == "index.html" and about.exists():
                  html = html.replace("  <!-- seo:about -->\n", about.read_text())
              p.write_text(html)
          PY
          for f in seo/*; do
            case "$(basename "$f")" in head-*.html|about-*.html|README.md) ;; *) cp "$f" _site/ ;; esac
          done
          # New cache name for each publish, so installed copies pick up the update.
          sed -i "s/__VERSION__/$(git -C app rev-parse --short HEAD)-$(git -C seo rev-parse --short HEAD)/" _site/sw.js
          grep -n 'const VERSION' _site/sw.js
          ls -la _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
