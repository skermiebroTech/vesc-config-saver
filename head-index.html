<script type="application/ld+json">[{"@context": "https://schema.org", "@type": "WebApplication", "name": "VESC Config Saver", "url": "https://vesc.9dtr.com/", "description": "Read a VESC board's motor, app and Refloat settings over Bluetooth, see every setting explained for beginners, and save them as one file.", "applicationCategory": "UtilitiesApplication", "operatingSystem": "Android (Chrome), any browser for the viewer", "browserRequirements": "Requires Web Bluetooth (Chrome on Android)", "offers": {"@type": "Offer", "price": "0", "priceCurrency": "USD"}, "isAccessibleForFree": true, "codeRepository": "https://github.com/skermiebroTech/vesc-config-saver", "sameAs": ["https://github.com/skermiebroTech/vesc-config-saver"], "featureList": ["Read VESC motor and app configuration over Bluetooth", "Read Refloat, Float, TNT and Balance package settings", "Works through a VESC Express over CAN", "Firmware 3.55 to 7.01", "Beginner explanations for every setting", "Passwords and PINs never saved", "Read-only: never writes to the board", "Ride logger: live Bluetooth logging and Refloat on-board recording download with charts and CSV export", "Compare two configs, or a config against the defaults", "Reads Float Accessories settings on a VESC Express"], "image": "https://vesc.9dtr.com/og.png"}, {"@context": "https://schema.org", "@type": "FAQPage", "mainEntity": [{"@type": "Question", "name": "What does VESC Config Saver do?", "acceptedAnswer": {"@type": "Answer", "text": "It connects to a VESC-based board over Bluetooth, reads the motor config, app config and every package config (Refloat, Float, TNT, Balance and others) from every VESC device on the board's CAN bus, and opens them in a config viewer. There you can download everything as one JSON file."}}, {"@type": "Question", "name": "Can it change the settings on my board?", "acceptedAnswer": {"@type": "Answer", "text": "No. The config saver only sends read commands: firmware version, CAN scan, read motor config, read app config and read package config. The commands that write settings are not in the code. The ride logger also only reads, with one side effect: downloading Refloat's on-board recording pauses that recording, the same as Refloat's own screen does, and it restarts next time you engage. The source is on GitHub if you want to check."}}, {"@type": "Question", "name": "Which boards and controllers does it work with?", "acceptedAnswer": {"@type": "Answer", "text": "Any VESC controller reachable over Bluetooth, either through a VESC Express (for example JetFleet F6, Thor 300/301/400, Tronic X12, or kits with an added Express) or through an NRF Bluetooth module. It has been tested on a JetFleet F6 with a VESC Express."}}, {"@type": "Question", "name": "Which firmware versions are supported?", "acceptedAnswer": {"@type": "Answer", "text": "Every VESC firmware release from 3.55 to 7.01, including the built-in Balance app in firmware 3.62 to 6.02. Package settings are readable on any version because the controller sends their definitions."}}, {"@type": "Question", "name": "Which packages are supported?", "acceptedAnswer": {"@type": "Answer", "text": "Refloat, Float, TNT (Trick and Trail), the Balance package and any other package that registers a config page, on any device on the CAN bus, plus the VESC Express's own settings. Float Accessories on a VESC Express is read too, the same read-only way its own app screen reads it; its BMS keys and Pubmote pairing details stay hidden."}}, {"@type": "Question", "name": "Does it save my Wi-Fi password or Bluetooth PIN?", "acceptedAnswer": {"@type": "Answer", "text": "No. Passwords and PINs, such as a VESC Express's Wi-Fi password and Bluetooth PIN, are replaced with \"(hidden)\" and never saved."}}, {"@type": "Question", "name": "Which browsers work?", "acceptedAnswer": {"@type": "Answer", "text": "Chrome on Android, and other Chromium browsers such as Edge, Opera and Samsung Internet. Firefox and iPhone Safari do not support Web Bluetooth. The config viewer works in any browser."}}, {"@type": "Question", "name": "What does the config viewer show?", "acceptedAnswer": {"@type": "Answer", "text": "A card for every setting with its value, a plain-language explanation for beginners, a practical tip, and whether it was changed from the default. It has search, a filter for changed settings, and a desktop layout."}}, {"@type": "Question", "name": "Can it log ride data like a blackbox?", "acceptedAnswer": {"@type": "Answer", "text": "Yes. The ride logger records live data over Bluetooth at about 10 to 30 samples a second (speed, duty, currents, voltage, temperatures, pitch, roll, setpoints and foot sensors with Refloat), or downloads Refloat's on-board data recording, which captures a few seconds at the full balance-loop rate and needs firmware with data recording (Refloat Extras). Both show synced charts with disengage, pushback and wheel slip events, and export to CSV."}}, {"@type": "Question", "name": "Can I compare two configs?", "acceptedAnswer": {"@type": "Answer", "text": "Yes. The compare page opens two saved configs, or one config against the default values, and lists every setting that differs with both values, how much it changed, and what the setting means. You can download the differences as CSV."}}]}]</script>
